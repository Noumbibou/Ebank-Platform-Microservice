<div class="p-3">
  @if (accounts$ | async; as state){
    <table class="table">
      <thead>
        <tr>
          <th>ID</th>
          <th>balance</th>
          <th>currency</th>
          <th>type</th>
          <th>customerId</th>
        </tr>
      </thead>
      <tbody>
        @for (acc of state.accounts; track acc){
          <tr>
            <td> {{acc.id}} </td>
            <td> {{acc.balance}} </td>
            <td> {{acc.currency}} </td>
            <td> {{acc.type}} </td>
            <td> {{acc.customerId}} </td>
          </tr>
        }
      </tbody>
    </table>
  }
</div>
